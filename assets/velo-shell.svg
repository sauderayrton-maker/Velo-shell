<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%"   stop-color="#bfe0fb"/>
      <stop offset="50%"  stop-color="#5b9cca"/>
      <stop offset="100%" stop-color="#2c5d82"/>
    </linearGradient>
    <linearGradient id="vg" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaf5fd"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background — same accent gradient as the rest of the Velo suite -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#sheen)"/>

  <!-- Status bar strip -->
  <rect x="9" y="13" width="46" height="11" rx="5.5" fill="rgba(15,30,48,0.22)"/>

  <!-- Workspace pills -->
  <rect x="13" y="16.5" width="6" height="4" rx="2" fill="url(#vg)"/>
  <rect x="21" y="16.5" width="6" height="4" rx="2" fill="rgba(255,255,255,0.40)"/>
  <rect x="29" y="16.5" width="6" height="4" rx="2" fill="rgba(255,255,255,0.40)"/>

  <!-- Clock pill -->
  <rect x="41" y="16" width="10" height="5" rx="2.5" fill="rgba(255,255,255,0.65)"/>

  <!-- Bottom accent line — tachometer motif, shared with Velo Browser/Player/Files/Launcher -->
  <line x1="18" y1="50" x2="46" y2="50"
        stroke="rgba(15,30,48,0.32)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
