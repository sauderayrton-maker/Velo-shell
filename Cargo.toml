[package]
name = "velo-shell"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "A Hyprland status bar with the Velo cockpit aesthetic"

[[bin]]
name = "velo-shell"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
glib = "0.22"
gio = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
